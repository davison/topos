Derived from Lucide's FlaskConical glyph. The stroke color is baked as the
literal hex #94a3b8 (muted-foreground) instead of the upstream
stroke="currentColor": an img-loaded SVG renders in its own opaque
context and cannot inherit a page CSS color (09-UI-SPEC.md Fix 10, "Baked
color, not currentColor"). ISC is a permissive license that allows
redistributing this modified copy.

Note for future editors of this file: an XML/SVG comment must never
contain a literal double-hyphen sequence in its body (only as the closing
delimiter) - Chromium parses an img-loaded SVG with a strict XML parser,
and a stray double-hyphen here silently fails the whole document's parse,
which surfaces only as the frontend's Puzzle fallback with no console
error naming this file.
-->
