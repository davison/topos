# webspaces config — copy to ~/.config/webspaces/config.toml (or
# $XDG_CONFIG_HOME/webspaces/config.toml if XDG_CONFIG_HOME is set) and
# fill in your own values.
#
# One file holds kernel settings, source connections, and webspace
# definitions (D-04). Every key below is documented with its purpose, its
# default (if any), and its validation rule.
#
# Secrets are NEVER stored in this file (D-04) — only ${VAR} references,
# expanded from the environment at load time via Go's os.Expand. An
# unset variable expands to the empty string and is reported by name in
# the load-time error, not silently accepted.
#
# Keyword matching is exact, case-insensitive (D-03): "house" matches a
# tag/folder/group literally named "House", but does NOT match "Household"
# — there is no substring or prefix matching, and no NFC/NFD Unicode
# normalization, so keep your keyword spelling consistent with how each
# source actually names things. All keywords in a webspace's list are
# matched against every configured plugin's own native categorization
# (paperless-ngx tags today; IMAP folders/labels, chat group names, and
# SilverBullet page tags in later phases) — there is no per-source
# override syntax (D-02). If one silo names a topic differently than
# another, add that silo's own spelling as an additional keyword in the
# same list, rather than looking for a per-source config knob.

[server]
# listen: host:port the kernel's HTTP API and embedded web UI bind to.
# Default: "127.0.0.1:7777" if omitted.
# Validation: none enforced at load time, but binding anything other than
# 127.0.0.1/localhost/::1 is a deliberate security decision this project
# has not made for v1 — the kernel logs a warning at startup ("this
# exposes the API beyond this machine") rather than refusing to start.
# There is no authentication on this API in v1; only loopback binding
# keeps it private.
listen = "127.0.0.1:7777"

[index]
# path: filesystem location of the local SQLite index (the hybrid data
# model's persisted metadata+preview store — KERN-03). A leading "~" is
# expanded to the current user's home directory.
# Default: "~/.local/share/webspaces/index.db" if omitted.
# Validation: the parent directory is created on demand; no other
# validation.
path = "~/.local/share/webspaces/index.db"

[plugins]
# dir: where the kernel looks for plugin binaries at startup. A relative
# path is resolved relative to the running "webspaces" executable's own
# directory, not the current working directory — so "make build"'s
# bin/webspaces and bin/plugins/ layout works regardless of where you run
# the binary from.
# Default: "plugins" if omitted.
# Validation: none at config-load time; a missing binary for a configured
# source fails at "webspaces sync"/"webspaces serve" startup, by name.
dir = "plugins"

[sync]
# interval: how often the background scheduler refreshes every configured
# source (KERN-04). Each source's FIRST refresh happens immediately at
# kernel startup, not one interval later — the interval only governs the
# repeating cadence after that first run. A per-source [sources.<name>]
# sync_interval key (documented below) overrides this for one source
# alone.
# Default: "15m" if omitted.
# Validation: must parse as a Go duration (e.g. "5m", "90s", "1h") and be
# strictly positive; an unparseable or zero/negative value fails config
# load, naming the "[sync] interval" key.
interval = "15m"

# [sources.<name>] — one block per source plugin instance. "<name>" is
# your own label (it does not have to match the plugin's source_type; the
# kernel always learns source_type from the plugin's own Describe RPC,
# never from this key).
[sources.paperless]
# plugin: the plugin binary's filename, resolved inside [plugins] dir.
# Validation: none at load time; a missing file fails at startup, by path.
plugin = "webspaces-plugin-paperless"

# base_url: the paperless-ngx instance's base URL. ${PAPERLESS_URL} is
# expanded from the environment — never hardcode a real URL/host here if
# you intend to share this file; use the ${VAR} form even for a
# non-secret value like this one, for consistency with token, below.
# Validation: must be non-empty after expansion; an empty value (e.g. from
# an unset PAPERLESS_URL) fails config load, naming the missing variable.
base_url = "${PAPERLESS_URL}"

# token: the paperless-ngx API token. Secrets NEVER live in this file as
# literal values (D-04) — only a ${VAR} reference belongs here.
# Validation: must be non-empty after expansion; same missing-variable
# error shape as base_url.
token = "${PAPERLESS_TOKEN}"

# api_version: the paperless-ngx REST API version this plugin negotiates
# via the Accept header (e.g. "application/json; version=10"). Match your
# paperless-ngx instance's supported API version range.
# Validation: none enforced; an incompatible version will surface as an
# HTTP error from paperless-ngx itself at sync time.
api_version = "10"

[sources.silverbullet]
# plugin: the plugin binary's filename, resolved inside [plugins] dir.
# Validation: none at load time; a missing file fails at startup, by path.
plugin = "webspaces-plugin-silverbullet"

# base_url: the SilverBullet instance's base URL. ${SILVERBULLET_URL} is
# expanded from the environment, same as paperless's base_url above.
# Unlike paperless-ngx, SilverBullet has no API-version negotiation, so
# there is no api_version key for this source.
# Validation: must be non-empty after expansion; an empty value (e.g. from
# an unset SILVERBULLET_URL) fails config load, naming the missing
# variable. A trailing slash is tolerated — the plugin normalizes it away
# before building requests.
base_url = "${SILVERBULLET_URL}"

# token: the SilverBullet SB_AUTH_TOKEN. Secrets NEVER live in this file as
# literal values (D-04) — only a ${VAR} reference belongs here. Sent as a
# Bearer token on every request regardless of whether this SilverBullet
# instance currently enforces it — SB_AUTH_TOKEN is still the documented,
# correct auth mechanism (some instances enforce it, some don't; this
# plugin behaves correctly either way).
# Validation: must be non-empty after expansion; same missing-variable
# error shape as base_url.
token = "${SB_AUTH_TOKEN}"

# sync_interval: OPTIONAL per-source override of [sync] interval, above —
# lets one heavy or rate-limited source sync less often without slowing
# every other configured source down to match.
# Default: unset, meaning "use the global [sync] interval".
# Validation: same as [sync] interval — must parse as a positive Go
# duration; an unparseable or zero/negative value fails config load,
# naming this source's "sync_interval" key.
# sync_interval = "30m"

# ca_cert: OPTIONAL filesystem path to a PEM-encoded CA certificate this
# source's plugin client should trust in addition to the system trust
# store. Not part of the original plan for this phase — added live during
# Task 1 execution because a real SilverBullet instance may sit behind a
# self-signed TLS certificate the system trust store does not contain
# (confirmed against this deployment's actual instance). Leave unset (or
# omit the key) for an instance whose certificate already chains to a CA
# in your system's trust store.
# Validation: none enforced at config-load time; an unreadable or
# unparsable file falls back to the system trust store, and TLS
# verification then fails at sync/health time with a clear "unavailable"
# error rather than a load-time error.
# ca_cert = "~/.config/webspaces/silverbullet-ca.pem"

[sources.proton]
# plugin: the plugin binary's filename, resolved inside [plugins] dir.
# Validation: none at load time; a missing file fails at startup, by path.
plugin = "webspaces-plugin-proton"

# base_url: "imaps://host:port" for implicit TLS, or "imap://host:port"
# for a plaintext connect immediately followed by a mandatory STARTTLS —
# the scheme you use MUST match what Proton Mail Bridge -> Settings
# reports as this account's IMAP connection security. ${PROTON_BRIDGE_ADDR}
# is the LAN address:port of the socat/stunnel forwarder set up on the
# home server running Bridge (Bridge itself only ever binds
# 127.0.0.1 — see 03-RESEARCH.md Pitfall 2 — so this forwarder step is
# not optional).
# Validation: must be non-empty after expansion, and the scheme must be
# exactly "imap" or "imaps"; anything else fails plugin startup, naming
# the invalid scheme.
base_url = "imaps://${PROTON_BRIDGE_ADDR}"

# username: the Bridge-generated Bridge username for this account (Bridge
# -> Settings) — NOT your real Proton account email address, and never a
# literal secret value here (${VAR} only, D-04).
# Validation: must be non-empty after expansion; same missing-variable
# error shape as base_url.
username = "${PROTON_BRIDGE_USER}"

# token: the Bridge-generated Bridge password (Bridge -> Settings) —
# reused as the IMAP LOGIN password. This is scoped to Bridge alone and
# cannot be used to sign in to the Proton account itself, even if leaked.
# Validation: must be non-empty after expansion; same missing-variable
# error shape as base_url.
token = "${PROTON_BRIDGE_PASS}"

# ca_cert: filesystem path to Bridge's exported TLS certificate (Bridge ->
# Settings -> Advanced -> "Export TLS certificates"). Required in
# practice — Bridge's certificate is self-signed, so the system trust
# store will not verify it. A leading "~" is expanded to your home
# directory.
# Validation: none enforced at config-load time; an unreadable or
# unparsable file falls back to the system trust store, and TLS
# verification then fails at sync/health time with a clear "unavailable"
# error rather than a load-time error.
ca_cert = "~/.config/webspaces/proton-bridge-cert.pem"

# webmail_base_url: this account's Proton webmail root, INCLUDING the
# account index (e.g. "https://mail.proton.me/u/0") — read from the
# address bar with any Proton view open (not specifically a label view;
# the value is no longer used to build one). Used only to build a
# clickable ANCHORED link into that account's All Mail view, narrowed by
# a search for the message's subject, sender and date — narrower than a
# subject-only search, so a generic subject ("Invoice") lands the reader
# in a short filtered list rather than every message that ever shared it,
# but still a filtered LIST containing the message, never the message
# itself. Proton addresses custom labels and folders by an internal id
# rather than by name, so a link built from a label's NAME is not
# addressable and lands on the inbox — All Mail is the name-addressable
# system view this plugin targets instead. The plugin never fetches this
# URL itself.
# Validation: must be non-empty after expansion; same missing-variable
# error shape as base_url.
webmail_base_url = "${PROTON_WEBMAIL_BASE}"

[sources.proton.agent]
read = false
handoff = false

# [sources.<name>.agent] — this source's per-plugin agent grant (AGENT-01,
# D-11): whether an automated caller through /agent/v1 may read this
# source's items, and whether it may hand actions off through this
# source's own interfaces. Two independent booleans, both default to
# false (deny): an absent [sources.<name>.agent] block, an absent key
# within one, and an explicit "= false" are ALL identically "deny" — there
# is no special "default"/"enabled" key that widens this; the absence of a
# grant IS the deny. A source with read = false is structurally absent
# from every /agent/v1/* response: absent from GET /agent/v1/sources, its
# items absent from every agent stream, and its items unreadable through
# every agent item route — indistinguishable from a source that does not
# exist. read and handoff are independent: neither implies the other.
# handoff is published as metadata only in v1 (the capabilities.handoff
# field of GET /agent/v1/sources) — no route in this version of the API
# acts on it; agent-initiated actions (AGENT-11) are a v1.x concern.
#
# This example deliberately grants silverbullet read access and leaves
# paperless ungranted, so the two blocks below demonstrate the asymmetry a
# real deployment will have rather than a uniform setting.
[sources.paperless.agent]
read = false
handoff = false

[sources.silverbullet.agent]
read = true
handoff = false

[sources.signal]
# plugin: the plugin binary's filename, resolved inside [plugins] dir.
# Validation: none at load time; a missing file fails at startup, by path.
plugin = "webspaces-plugin-signal"

# path: Signal Desktop's own config directory — the source of both
# config.json (SQLCipher key resolution) and sql/db.sqlite (the message
# database itself, opened strictly read-only). A leading "~" is expanded
# by the plugin subprocess itself, not the kernel (kernel/config/types.go's
# Path doc comment).
#
# This source needs NO base_url, NO token, and NO environment variable at
# all — unlike every other source in this file, the SQLCipher decryption
# key is resolved entirely at runtime from files inside this directory
# (Signal Desktop's own config.json), never stored in this project's own
# config or environment (SRC-02).
# Validation: kernel/config.Validate accepts a source declaring only
# path, in place of base_url+token; a source declaring none of the three
# fails config load naming both accepted shapes.
# Default Signal Desktop location on Linux: "~/.config/Signal".
path = "~/.config/Signal"

[sources.signal.agent]
read = false
handoff = false

# [sources.mock] — the reference "mock" plugin (plugins/mock, PLUG-05):
# a working SourcePlugin built entirely from docs/plugin-contract.md, the
# proto/topos/v1/plugin.proto wire contract, and the sdk module, with
# no network dependency and a fixed, in-memory item set. Uncomment this
# block (and the [webspaces.demo] block at the bottom of this file) to
# see it in action without any real source system to connect to.
#
# plugin: the plugin binary's filename, resolved inside [plugins] dir —
# `make build` produces bin/plugins/webspaces-plugin-mock alongside the
# other two plugin binaries.
# plugin = "webspaces-plugin-mock"
#
# base_url / token: the mock plugin's own main.go does NOT require
# WEBSPACES_SOURCE_CONFIG to be set at all — it has no connection details
# to configure. The two placeholder lines below exist only because
# kernel/config.Validate requires EITHER base_url+token OR path to be
# non-empty for every configured source, regardless of whether the
# plugin itself needs them — a pre-existing kernel-level constraint
# (relaxed in 04-01-PLAN.md for a genuinely configless local-path source;
# see the signal source block above, the first source to use the path
# shape).
# Any non-empty placeholder value works; the mock plugin ignores both.
# base_url = "unused"
# token = "unused"
#
# [sources.mock.agent] — same shape as every other source's agent grant,
# above.
# [sources.mock.agent]
# read = true
# handoff = false

# [webspaces.<name>] — one block per webspace. "<name>" becomes the
# webspace's URL slug (e.g. /w/house-move) and its GET
# /api/webspaces/{name}/stream path segment.
[webspaces.house-move]
# keywords: every string here is matched, exactly and case-insensitively,
# against every configured plugin's native categorization for this
# webspace. This example's real value differs from the illustrative
# "house-move"/"House" pair used elsewhere in this project's docs: this
# deployment's actual paperless-ngx tag for the topic is "house and
# home" — the webspace's slug/name stays "house-move" for URL/docs
# consistency, but the keyword list reflects what the source system
# actually calls it. Add more strings to this list (rather than editing
# the source) if a second plugin/source names the same topic differently.
# Validation: at least one non-empty, non-whitespace-only keyword is
# required; a webspace with zero keywords, or any empty-string keyword,
# fails config load.
keywords = ["house and home"]

# [webspaces.demo] — pairs with the commented-out [sources.mock] block
# above: "demo" matches the label every one of plugins/mock's four fixed
# items carries, so uncommenting both blocks and running `webspaces sync`
# populates this webspace with all four mock items.
# [webspaces.demo]
# keywords = ["demo"]
