# webspaces config — copy to ~/.config/topos/config.toml (or
# $XDG_CONFIG_HOME/webspaces/config.toml if XDG_CONFIG_HOME is set) and
# fill in your own values.
#
# One file holds kernel settings, source connections, and webspace
# definitions (D-04). Every key below is documented with its purpose, its
# default (if any), and its validation rule.
#
# Secrets are NEVER stored in this file (D-04) — only ${VAR} references,
# expanded from the environment at load time via Go's os.Expand. An
# unset variable expands to the empty string and is reported by name in
# the load-time error, not silently accepted.
#
# Matching is exact, case-insensitive (D-04): "house" matches a value
# literally named "House", but does NOT match "Household" — there is no
# substring or prefix matching, and no NFC/NFD Unicode normalization, so
# keep your spelling consistent with how each source actually names
# things. What changed in Phase 5: matching is no longer one shared
# keyword list compared against every source's categorization uniformly.
# Instead, each SOURCE INSTANCE (a [sources.<id>] block, below) declares
# its own typed field vocabulary via its plugin's Describe RPC — a
# paperless-ngx instance matches on "tags", a SilverBullet instance on
# "tags" and "pages", a Proton instance on "folders", a Signal instance
# on "conversations" — and a webspace either supplies typed values for
# those fields directly (a [webspaces.<name>.match.<instance>] block,
# D-02) or falls back to one shared "keywords" list fanned across every
# field that instance's plugin declares (D-01). See "[webspaces.<name>]",
# near the bottom of this file, for the full worked shape and every
# load-time failure this can produce.
#
# The UI can write this file too (Phase 7, KERN-08): every builder surface
# — creating/editing a webspace, adding/editing/removing a source
# instance, saving a search as a permanent filter — persists through the
# kernel's PUT /api/config, the same file this comment lives in. A UI save
# rewrites config.toml in a CANONICAL, MINIMAL form: it round-trips every
# key this file's Config struct models, but flattens hand-written
# comments (like this one) and re-orders tables to Go's own struct field
# order — expect a save from the UI to change this file's surrounding
# prose even where it doesn't touch a value you care about. Your previous
# content is never silently lost: every write backs it up to
# config.toml.bak first (overwriting any earlier backup), immediately
# before the new content lands via an atomic temp-file-plus-rename. Hand-
# editing remains fully supported in both directions — the UI and a
# hand-edit always agree on this one persisted shape, and a change you
# make by hand reaches the running kernel via the UI's own
# "Manage sources… -> Reload config" button (POST /api/config/reload),
# without a restart; there is deliberately no file watcher, so a hand-edit
# sits inert until that button is clicked. See docs/api.md's
# "PUT /api/config" and "POST /api/config/reload" sections for the full
# write/reload contract, including the optimistic-lock guard that refuses
# a UI save started from a config.toml that's since changed out from
# under it.

[server]
# listen: host:port the kernel's HTTP API and embedded web UI bind to.
# Default: "127.0.0.1:7777" if omitted.
# Validation: none enforced at load time, but binding anything other than
# 127.0.0.1/localhost/::1 is a deliberate security decision this project
# has not made for v1 — the kernel logs a warning at startup ("this
# exposes the API beyond this machine") rather than refusing to start.
# There is no authentication on this API in v1; only loopback binding
# keeps it private.
listen = "127.0.0.1:7777"

[index]
# path: filesystem location of the local SQLite index (the hybrid data
# model's persisted metadata+preview store — KERN-03). A leading "~" is
# expanded to the current user's home directory.
# Default: "~/.local/share/topos/index.db" if omitted.
# Validation: the parent directory is created on demand; no other
# validation.
path = "~/.local/share/topos/index.db"

[plugins]
# dir: where the kernel looks for plugin binaries at startup. A relative
# path is resolved relative to the running "topos" executable's own
# directory, not the current working directory — so "make build"'s
# bin/topos and bin/plugins/ layout works regardless of where you run
# the binary from.
# Default: "plugins" if omitted.
# Validation: none at config-load time; a missing binary for a configured
# source fails at "topos sync"/"topos serve" startup, by name.
#
# Staleness warning if you override this to an ABSOLUTE path (e.g.
# pointing at a different checkout's bin/plugins/ so you don't have to
# rebuild in every worktree): `make dev`/`make build`'s plugin rebuild
# only ever writes into THIS checkout's own bin/plugins/ — an absolute
# `dir` elsewhere is never touched by that rebuild, so the kernel can
# silently serve plugin binaries built from a DIFFERENT (possibly older)
# commit than the one you're actually running. This is invisible for
# most RPCs (Match/Health/Fetch keep working against whatever contract
# that older binary implements) but shows up as a plugin-declared
# feature quietly missing — e.g. every source chip falling back to the
# generic Puzzle icon because an old binary's Describe response predates
# the icon fields (09-02-PLAN.md). If you use an absolute dir here,
# either point it at THIS checkout's own bin/plugins/, or re-run
# `make plugins`/`make build` in whichever checkout it actually names
# before expecting a plugin-side code change to take effect.
dir = "plugins"

# external_dir: the SECOND, UNTRUSTED plugin directory (Phase 11,
# PLUG-06/07) — a peer of "dir" above, scanned alongside it. A binary
# resolved from here is tagged tier "external" everywhere the kernel's
# HTTP API and UI report trust (GET /api/sources' "tier" field,
# GET /api/config/plugin-types' "plugin_type_tiers"); a binary resolved
# from "dir" above is always "trusted". Trust is derived EXCLUSIVELY from
# which directory a binary's bytes resolved from at launch time — never
# from anything the binary itself declares. If a binary of the same
# filename exists in BOTH directories, the trusted copy always wins and
# the kernel logs a named warning identifying the shadowed external copy.
# Default: unset, which resolves to a per-OS platform data directory with
# no config required — "$XDG_DATA_HOME/topos/plugins-external" (falling
# back to "~/.local/share/topos/plugins-external") on Linux,
# "~/Library/Application Support/topos/plugins-external" on macOS,
# "%LOCALAPPDATA%\topos\plugins-external" on Windows. A relative value
# here resolves relative to the running "topos" executable, exactly like
# "dir" above; an absolute value is used verbatim.
# Validation: none at config-load time; a missing directory here is a
# legitimate, unremarkable empty external tier, not an error — the
# kernel never creates it. See docs/plugin-contract.md's "Trust tiers"
# section for the full shape.
# external_dir = "plugins-external"

# [plugins.pins] — content-hash pins for the EXTERNAL tier only (D-01/
# D-02/D-03/D-04, Phase 11 PLUG-07). Each key is an external-tier plugin
# BINARY name (e.g. "topos-plugin-example"); each value is the lowercase
# hex SHA-256 digest of that binary's exact bytes, recorded the first
# time an operator adds a source using it and RE-VERIFIED before every
# subsequent launch — a binary whose on-disk bytes no longer match its
# pin is refused launch entirely (never executed), surfacing as that
# source's own "launch_failure": "pin_mismatch" on GET /api/sources
# rather than taking down any other configured source.
#
# The kernel's own UI writes and repairs this table for you as part of
# adding an external source and the "Trust updated binary" re-pin action
# — hand-editing it is never required, though a hand-edited entry is
# honored exactly like any other config key. A trusted-tier binary
# (resolved from "dir" above) is NEVER pinned, even if it happens to
# share a name with an entry here — pins apply to the external tier
# exclusively, since a trusted binary is rebuilt constantly by
# "make build"/"make dev" and pinning it would false-alarm on every
# rebuild.
# Validation: a key not shaped like a plugin binary name, or a value that
# isn't exactly 64 lowercase hex characters, fails config load, naming
# the offending key. A pin only proves the bytes are unchanged since you
# accepted them — not who published them; verify a publisher's own
# checksum yourself before first adding a source, if one is offered.
# [plugins.pins]
# topos-plugin-example = "3f2a9c1e5b7d0f4a8c6e2b1d9f3a7c5e0b4d8f2a6c1e9b3d7f5a0c4e8b2d6f1a"

[sync]
# interval: how often the background scheduler refreshes every configured
# source (KERN-04). Each source's FIRST refresh happens immediately at
# kernel startup, not one interval later — the interval only governs the
# repeating cadence after that first run. A per-source [sources.<name>]
# sync_interval key (documented below) overrides this for one source
# alone.
# Default: "15m" if omitted.
# Validation: must parse as a Go duration (e.g. "5m", "90s", "1h") and be
# strictly positive; an unparseable or zero/negative value fails config
# load, naming the "[sync] interval" key.
interval = "15m"

# [sources.<name>] — one block per source plugin INSTANCE. "<name>" is
# your own label (it does not have to match the plugin's source_type; the
# kernel always learns source_type from the plugin's own Describe RPC,
# never from this key) — and it is also this instance's IDENTITY (D-08):
# it prefixes every item id this instance ever produces, keys its own
# sync history, and is what a [sources.<name>.agent] grant and a
# [webspaces.<ws>.match.<name>] block both key on. Renaming this map key
# creates a brand-new instance from the kernel's point of view — its old
# items and sync history do not follow the rename. The SAME plugin binary
# can be launched more than once under different "<name>" keys — see the
# "home-email"/"work-email" worked example below, after [sources.proton].
[sources.paperless]
# plugin: the plugin binary's filename, resolved inside [plugins] dir.
# Validation: none at load time; a missing file fails at startup, by path.
plugin = "topos-plugin-paperless"

# display_name: this instance's operator-authored label, shown by the UI
# and published on every HTTP response that names a source (D-09).
# Optional: when omitted, the instance's display name resolves to the
# instance id itself (the "paperless" map key above). Purely cosmetic
# (D-08) — editing this value never changes which instance an item, sync
# run, or agent grant belongs to; only renaming the [sources.<id>] map
# key itself does that.
# Validation: must be unique across every configured source instance
# (case-insensitive); two instances resolving to the same display name
# (whether by explicit display_name or by both leaving it unset with
# identical map keys, which TOML itself already forbids) fails config
# load, naming both offending instances.
display_name = "paperless-ngx"

# base_url: the paperless-ngx instance's base URL. ${PAPERLESS_URL} is
# expanded from the environment — never hardcode a real URL/host here if
# you intend to share this file; use the ${VAR} form even for a
# non-secret value like this one, for consistency with token, below.
# Validation: must be non-empty after expansion; an empty value (e.g. from
# an unset PAPERLESS_URL) fails config load, naming the missing variable.
base_url = "${PAPERLESS_URL}"

# token: the paperless-ngx API token. Secrets NEVER live in this file as
# literal values (D-04) — only a ${VAR} reference belongs here.
# Validation: must be non-empty after expansion; same missing-variable
# error shape as base_url.
token = "${PAPERLESS_TOKEN}"

# api_version: the paperless-ngx REST API version this plugin negotiates
# via the Accept header (e.g. "application/json; version=10"). Match your
# paperless-ngx instance's supported API version range.
# Validation: none enforced; an incompatible version will surface as an
# HTTP error from paperless-ngx itself at sync time.
api_version = "10"

# [sources.paperless.extras] — OPTIONAL per-instance table of
# provider-specific settings this plugin's own Describe RPC may declare
# expecting, beyond the built-in base_url/token/api_version fields above
# (D-12/D-13, Phase 11 PLUG-09). Every value is a string; a ${VAR}
# reference inside one expands from the environment exactly like
# base_url/token do. Reaches the plugin subprocess nested inside
# WEBSPACES_SOURCE_CONFIG as an "extras" object — omitted entirely (no
# key at all) when this table is absent, so a plugin's own JSON decode
# sees an unambiguous "no extras configured", never an empty object.
# paperless doesn't itself declare or read any extras key today; this
# block is left commented as the worked shape for a plugin that does —
# see docs/plugin-contract.md's "Configuration" and "Describe" sections
# for the full contract, including the optional Describe-side field
# declaration (key/label/required/secret/placeholder) a plugin may use to
# drive the kernel's own add-source form.
# Validation: an empty key, or one outside [A-Za-z_][A-Za-z0-9_.-]*, fails
# config load, naming the offending source instance and key.
# [sources.paperless.extras]
# region = "${PAPERLESS_REGION}"

[sources.silverbullet]
# plugin: the plugin binary's filename, resolved inside [plugins] dir.
# Validation: none at load time; a missing file fails at startup, by path.
plugin = "topos-plugin-silverbullet"

# display_name: see [sources.paperless]'s display_name comment, above —
# identical shape and validation for every source.
display_name = "SilverBullet"

# base_url: the SilverBullet instance's base URL. ${SILVERBULLET_URL} is
# expanded from the environment, same as paperless's base_url above.
# Unlike paperless-ngx, SilverBullet has no API-version negotiation, so
# there is no api_version key for this source.
# Validation: must be non-empty after expansion; an empty value (e.g. from
# an unset SILVERBULLET_URL) fails config load, naming the missing
# variable. A trailing slash is tolerated — the plugin normalizes it away
# before building requests.
base_url = "${SILVERBULLET_URL}"

# token: the SilverBullet SB_AUTH_TOKEN. Secrets NEVER live in this file as
# literal values (D-04) — only a ${VAR} reference belongs here. Sent as a
# Bearer token on every request regardless of whether this SilverBullet
# instance currently enforces it — SB_AUTH_TOKEN is still the documented,
# correct auth mechanism (some instances enforce it, some don't; this
# plugin behaves correctly either way).
# Validation: must be non-empty after expansion; same missing-variable
# error shape as base_url.
token = "${SB_AUTH_TOKEN}"

# sync_interval: OPTIONAL per-source override of [sync] interval, above —
# lets one heavy or rate-limited source sync less often without slowing
# every other configured source down to match.
# Default: unset, meaning "use the global [sync] interval".
# Validation: same as [sync] interval — must parse as a positive Go
# duration; an unparseable or zero/negative value fails config load,
# naming this source's "sync_interval" key.
# sync_interval = "30m"

# ca_cert: OPTIONAL filesystem path to a PEM-encoded CA certificate this
# source's plugin client should trust in addition to the system trust
# store. Not part of the original plan for this phase — added live during
# Task 1 execution because a real SilverBullet instance may sit behind a
# self-signed TLS certificate the system trust store does not contain
# (confirmed against this deployment's actual instance). Leave unset (or
# omit the key) for an instance whose certificate already chains to a CA
# in your system's trust store.
# Validation: none enforced at config-load time; an unreadable or
# unparsable file falls back to the system trust store, and TLS
# verification then fails at sync/health time with a clear "unavailable"
# error rather than a load-time error.
# ca_cert = "~/.config/topos/silverbullet-ca.pem"

[sources.proton]
# plugin: the plugin binary's filename, resolved inside [plugins] dir.
# Validation: none at load time; a missing file fails at startup, by path.
plugin = "topos-plugin-proton"

# display_name: see [sources.paperless]'s display_name comment, above —
# identical shape and validation for every source.
display_name = "Proton Mail"

# base_url: "imaps://host:port" for implicit TLS, or "imap://host:port"
# for a plaintext connect immediately followed by a mandatory STARTTLS —
# the scheme you use MUST match what Proton Mail Bridge -> Settings
# reports as this account's IMAP connection security. ${PROTON_BRIDGE_ADDR}
# is the LAN address:port of the socat/stunnel forwarder set up on the
# home server running Bridge (Bridge itself only ever binds
# 127.0.0.1 — see 03-RESEARCH.md Pitfall 2 — so this forwarder step is
# not optional).
# Validation: must be non-empty after expansion, and the scheme must be
# exactly "imap" or "imaps"; anything else fails plugin startup, naming
# the invalid scheme.
base_url = "imaps://${PROTON_BRIDGE_ADDR}"

# username: the Bridge-generated Bridge username for this account (Bridge
# -> Settings) — NOT your real Proton account email address, and never a
# literal secret value here (${VAR} only, D-04).
# Validation: must be non-empty after expansion; same missing-variable
# error shape as base_url.
username = "${PROTON_BRIDGE_USER}"

# token: the Bridge-generated Bridge password (Bridge -> Settings) —
# reused as the IMAP LOGIN password. This is scoped to Bridge alone and
# cannot be used to sign in to the Proton account itself, even if leaked.
# Validation: must be non-empty after expansion; same missing-variable
# error shape as base_url.
token = "${PROTON_BRIDGE_PASS}"

# ca_cert: filesystem path to Bridge's exported TLS certificate (Bridge ->
# Settings -> Advanced -> "Export TLS certificates"). Required in
# practice — Bridge's certificate is self-signed, so the system trust
# store will not verify it. A leading "~" is expanded to your home
# directory.
# Validation: none enforced at config-load time; an unreadable or
# unparsable file falls back to the system trust store, and TLS
# verification then fails at sync/health time with a clear "unavailable"
# error rather than a load-time error.
ca_cert = "~/.config/topos/proton-bridge-cert.pem"

# webmail_base_url: this account's Proton webmail root, INCLUDING the
# account index (e.g. "https://mail.proton.me/u/0") — read from the
# address bar with any Proton view open (not specifically a label view;
# the value is no longer used to build one). Used only to build a
# clickable ANCHORED link into that account's All Mail view, narrowed by
# a search for the message's subject, sender and date — narrower than a
# subject-only search, so a generic subject ("Invoice") lands the reader
# in a short filtered list rather than every message that ever shared it,
# but still a filtered LIST containing the message, never the message
# itself. Proton addresses custom labels and folders by an internal id
# rather than by name, so a link built from a label's NAME is not
# addressable and lands on the inbox — All Mail is the name-addressable
# system view this plugin targets instead. The plugin never fetches this
# URL itself.
# Validation: must be non-empty after expansion; same missing-variable
# error shape as base_url.
webmail_base_url = "${PROTON_WEBMAIL_BASE}"

[sources.proton.agent]
read = false
handoff = false

# [sources.<name>.agent] — this source's per-plugin agent grant (AGENT-01,
# D-11): whether an automated caller through /agent/v1 may read this
# source's items, and whether it may hand actions off through this
# source's own interfaces. Two independent booleans, both default to
# false (deny): an absent [sources.<name>.agent] block, an absent key
# within one, and an explicit "= false" are ALL identically "deny" — there
# is no special "default"/"enabled" key that widens this; the absence of a
# grant IS the deny. A source with read = false is structurally absent
# from every /agent/v1/* response: absent from GET /agent/v1/sources, its
# items absent from every agent stream, and its items unreadable through
# every agent item route — indistinguishable from a source that does not
# exist. read and handoff are independent: neither implies the other.
# handoff is published as metadata only in v1 (the capabilities.handoff
# field of GET /agent/v1/sources) — no route in this version of the API
# acts on it; agent-initiated actions (AGENT-11) are a v1.x concern.
#
# This example deliberately grants silverbullet read access and leaves
# paperless ungranted, so the two blocks below demonstrate the asymmetry a
# real deployment will have rather than a uniform setting.
[sources.paperless.agent]
read = false
handoff = false

[sources.silverbullet.agent]
read = true
handoff = false

# --- Two named instances of one plugin type (D-08/D-10) ---------------
#
# The kernel can launch the SAME plugin binary more than once — once per
# [sources.<id>] entry. Two instances of one plugin type always have
# distinct display names, distinct item id namespaces, distinct sync
# history, and independent agent grants; they never merge into one row
# anywhere in the kernel's index or HTTP API. This example illustrates
# the shape by splitting a single Proton account (above) into two: a
# personal inbox and a work inbox, both running topos-plugin-proton.
# Uncomment both blocks below (and give each its own real connection
# details/env vars — Bridge supports multiple linked accounts
# simultaneously) to run them alongside, or instead of, [sources.proton]
# above.
#
# [sources.home-email]
# plugin = "topos-plugin-proton"
# display_name = "Home email"
# base_url = "imaps://${PROTON_HOME_BRIDGE_ADDR}"
# username = "${PROTON_HOME_BRIDGE_USER}"
# token = "${PROTON_HOME_BRIDGE_PASS}"
# ca_cert = "~/.config/topos/proton-bridge-cert.pem"
# webmail_base_url = "${PROTON_HOME_WEBMAIL_BASE}"
#
# [sources.home-email.agent]
# read = true
# handoff = false
#
# [sources.work-email]
# plugin = "topos-plugin-proton"
# display_name = "Work email"
# base_url = "imaps://${PROTON_WORK_BRIDGE_ADDR}"
# username = "${PROTON_WORK_BRIDGE_USER}"
# token = "${PROTON_WORK_BRIDGE_PASS}"
# ca_cert = "~/.config/topos/proton-bridge-cert.pem"
# webmail_base_url = "${PROTON_WORK_WEBMAIL_BASE}"
#
# [sources.work-email.agent]
# read = false
# handoff = false
#
# Grants are per instance, never per plugin kind: granting home-email
# read access above never admits work-email's items through /agent/v1,
# even though both instances share one source_type ("proton") and one
# plugin binary. See "[webspaces.<name>]", below, for how each instance
# gets its own independent match configuration too.

[sources.signal]
# plugin: the plugin binary's filename, resolved inside [plugins] dir.
# Validation: none at load time; a missing file fails at startup, by path.
plugin = "topos-plugin-signal"

# display_name: see [sources.paperless]'s display_name comment, above —
# identical shape and validation for every source.
display_name = "Signal"

# path: Signal Desktop's own config directory — the source of both
# config.json (SQLCipher key resolution) and sql/db.sqlite (the message
# database itself, opened strictly read-only). A leading "~" is expanded
# by the plugin subprocess itself, not the kernel (kernel/config/types.go's
# Path doc comment).
#
# This source needs NO base_url, NO token, and NO environment variable at
# all — unlike every other source in this file, the SQLCipher decryption
# key is resolved entirely at runtime from files inside this directory
# (Signal Desktop's own config.json), never stored in this project's own
# config or environment (SRC-02).
# Validation: kernel/config.Validate accepts a source declaring only
# path, in place of base_url+token; a source declaring none of the three
# fails config load naming both accepted shapes.
# Default Signal Desktop location on Linux: "~/.config/Signal".
path = "~/.config/Signal"

[sources.signal.agent]
read = false
handoff = false

[sources.whatsapp]
# plugin: the plugin binary's filename, resolved inside [plugins] dir.
# Validation: none at load time; a missing file fails at startup, by path.
plugin = "topos-plugin-whatsapp"

# display_name: see [sources.paperless]'s display_name comment, above —
# identical shape and validation for every source.
display_name = "WhatsApp"

# path: this plugin's OWN data directory — home to TWO plugin-owned
# databases: whatsmeow's own linked-device session store (whatsmeow.db)
# and this plugin's own captured-message store (messages.db), neither of
# which is Signal Desktop's or any other source's own database. This path
# MUST NOT collide with [sources.signal]'s path or any other configured
# source's path — each source's own local state must stay isolated. A
# leading "~" is expanded by the plugin subprocess itself (main.go), not
# the kernel, mirroring [sources.signal]'s identical convention.
#
# Unlike Signal, this source needs NO base_url, NO token, and NO
# environment variable — the linked-device session keys live only inside
# whatsmeow's own session store under this path. Linking is a one-time,
# out-of-band step: run the plugin binary directly with its own -link
# flag (never through the running kernel):
#   bin/plugins/topos-plugin-whatsapp -link -path ~/.local/share/topos/whatsapp
# and scan the rendered ASCII QR code with your phone. Re-run the kernel
# (or `make dev`) after linking succeeds; the linked session survives a
# kernel restart with no second QR scan.
# Validation: kernel/config.Validate accepts a source declaring only
# path, in place of base_url+token — identical to [sources.signal].
path = "~/.local/share/topos/whatsapp"

[sources.whatsapp.agent]
read = false
handoff = false

# [sources.mock] — the reference "mock" plugin (plugins/mock, PLUG-05):
# a working SourcePlugin built entirely from docs/plugin-contract.md, the
# proto/topos/v1/plugin.proto wire contract, and the sdk module, with
# no network dependency and a fixed, in-memory item set. Uncomment this
# block (and the [webspaces.demo] block at the bottom of this file) to
# see it in action without any real source system to connect to.
#
# plugin: the plugin binary's filename, resolved inside [plugins] dir —
# `make build` produces bin/plugins/topos-plugin-mock alongside the
# other two plugin binaries.
# plugin = "topos-plugin-mock"
#
# display_name: see [sources.paperless]'s display_name comment, above —
# identical shape and validation for every source.
# display_name = "Mock Source"
#
# base_url / token: the mock plugin's own main.go does NOT require
# WEBSPACES_SOURCE_CONFIG to be set at all — it has no connection details
# to configure. The two placeholder lines below exist only because
# kernel/config.Validate requires EITHER base_url+token OR path to be
# non-empty for every configured source, regardless of whether the
# plugin itself needs them — a pre-existing kernel-level constraint
# (relaxed in 04-01-PLAN.md for a genuinely configless local-path source;
# see the signal source block above, the first source to use the path
# shape).
# Any non-empty placeholder value works; the mock plugin ignores both.
# base_url = "unused"
# token = "unused"
#
# [sources.mock.agent] — same shape as every other source's agent grant,
# above.
# [sources.mock.agent]
# read = true
# handoff = false

# [webspaces.<name>] — one block per webspace. "<name>" becomes the
# webspace's URL slug (e.g. /w/house-move) and its GET
# /api/webspaces/{name}/stream path segment.
#
# Each configured source INSTANCE lands its items in a webspace one of
# two ways (never both at once, for the same instance):
#
#   1. keywords (D-01, the FALLBACK): one shared list of strings, fanned
#      out across every field that instance's plugin declared in its
#      Describe match_vocabulary. This is the simplest shape — one list,
#      applies uniformly — and the only shape needed when your keyword
#      spelling happens to match cleanly across every field a plugin
#      declares.
#   2. [webspaces.<name>.match.<instance>] (D-02, the EXPLICIT BLOCK): a
#      table of field-name -> value-list, typed to that ONE instance's
#      own declared vocabulary. When present for an instance, this block
#      REPLACES the keywords fallback outright for that instance alone —
#      the two are never combined/unioned. Every OTHER participating
#      instance with no block of its own still falls back to keywords
#      normally.
#
# A webspace must declare a non-empty keywords list, at least one match
# block, or both — declaring neither fails config load. An instance
# participating in a webspace with an empty keywords list AND no match
# block of its own also fails config load (nothing to resolve its match
# input from at sync time) — this is the fifth failure mode below.
#
# sources (D-03, OPTIONAL): a participation allowlist. Empty/omitted (the
# default) means every configured source instance participates in this
# webspace. When non-empty, ONLY the named instances participate — every
# other configured instance is skipped at sync time for this webspace,
# and any rows it previously wrote here are cleared so no orphaned rows
# survive the config change.
#
# The webspace builder UI's own interaction with this key (D-14, Phase 7):
# the FIRST time a source is added to a webspace through the UI's "+"
# picker, the UI writes an EXPLICIT sources list — seeded with every
# instance that was already participating (the all-instances-participate
# default this key's absence already meant), plus the one just added —
# rather than leaving the key absent. A hand-written webspace with no
# sources key keeps the all-instances-participate default exactly as
# documented above; the builder never retroactively adds this key to a
# webspace you haven't touched in the UI, and never converts an explicit
# allowlist back into an absent key on your behalf either (deleting the
# last named instance through "Manage sources…" writes sources = [] —
# which this key's own default rule above still reads as
# all-instances-participate, not as "nothing participates").
#
# Five load-time failures the kernel names explicitly, by webspace and/or
# instance:
#   - a match field name the participating instance's plugin did not
#     declare in its own match_vocabulary (checked post-launch, against
#     the live plugin — pluginhost.ValidateMatchConfig, D-05)
#   - a match block or a sources entry naming an instance that isn't a
#     configured [sources.<id>] at all (typo signal)
#   - an instance named in BOTH this webspace's match table AND excluded
#     by this webspace's own sources allowlist — dead config, not a
#     staging feature; remove one or the other
#   - a webspace declaring neither keywords nor any match block (UNLESS it
#     is also a fully empty shell — see the next paragraph)
#   - a participating instance with no match block, in a webspace whose
#     keywords list is empty — nothing for that instance to resolve its
#     match input from
#
# An EMPTY webspace shell (D-20, Phase 7 gap closure): a [webspaces.<name>]
# block declaring NONE of keywords, sources, or match at all is a valid,
# loadable config state meaning "a webspace that exists and matches
# nothing yet." It is what the topos UI's "+ New webspace" writes the
# instant you name a new webspace, before you've added a single source to
# it — the two-write flow's first save. It correlates nothing (no plugin's
# Match RPC is ever called for it) until it gains a keywords fallback, at
# least one match block, or both. The moment a webspace names ANY instance
# under sources while still declaring neither keywords nor match, it stops
# being a shell and becomes the fourth load-time failure listed above —
# that combination reads as "allowlisted a source, then told it nothing to
# match," an operator typo the kernel keeps rejecting loudly rather than
# silently accepting.
#
# Matching itself stays exact and case-insensitive with no Unicode
# normalization (D-04) in both shapes above — only WHERE the value list
# comes from (one shared list vs. a typed, per-instance table) changed in
# Phase 5.
#
# filter (D-16/D-17/D-18, OPTIONAL, added Phase 7): a webspace's saved
# PERMANENT filter — a plain list of exact-word terms, AND-ed together and
# applied as a query-time narrowing on top of whatever keywords/match
# already correlated into this webspace. Unlike keywords/match (which
# decide WHICH items land in the webspace at sync time), filter narrows
# WHICH of those already-correlated items are shown, and applies
# identically to GET /api/webspaces/{name}/stream, .../search and the
# /agent/v1 stream mirror — the filtered view IS the webspace for every
# consumer. Absent or empty means "no narrowing": a webspace with no
# filter key streams byte-identically to its pre-Phase-7 output. The
# topos UI writes this list itself (the "Save as filter" button on a live
# search, and each filter chip's × to remove one term) — appending to the
# end, never reordering or deduping silently — but it's a plain TOML
# string array like any other config field, so hand-editing it (adding,
# removing, or reordering terms directly in this file) is fully
# supported; the UI and a hand-edit always agree on this one persisted
# shape.
[webspaces.house-move]
# keywords: the fallback (see above) — every string here is matched,
# exactly and case-insensitively, against every field each participating,
# block-less instance's plugin declared. This example's real value
# differs from the illustrative "house-move"/"House" pair used elsewhere
# in this project's docs: this deployment's actual paperless-ngx tag for
# the topic is "house and home" — the webspace's slug/name stays
# "house-move" for URL/docs consistency, but the keyword list reflects
# what the source system actually calls it. Add more strings to this
# list (rather than editing the source) if a second plugin/source names
# the same topic differently. In this example, "paperless" and "signal"
# have no explicit match block below, so both resolve their match input
# from this list.
# Validation: at least one non-empty, non-whitespace-only keyword is
# required whenever this list is non-empty; a webspace declaring it with
# zero keywords, or any empty-string keyword, fails config load.
keywords = ["house and home"]

# filter (see above): commented out here since this deployment currently
# has no saved permanent filter on this webspace — uncomment and edit
# freely, or just click "Save as filter" on a live search in the UI,
# which writes this same array.
# filter = ["boiler"]

# [webspaces.house-move.match.silverbullet] — an EXPLICIT block (D-02):
# replaces the keywords fallback above for the "silverbullet" instance
# alone. SilverBullet declares a two-field vocabulary, "tags" and
# "pages" — a page matches if its tags match any "tags" value OR its page
# name matches any "pages" value (the two fields are independent, unioned
# results, never combined into one comparison).
[webspaces.house-move.match.silverbullet]
tags = ["house"]
pages = ["House Move Checklist"]

# [webspaces.house-move.match.proton] — Proton declares a one-field
# vocabulary, "folders": the IMAP mailbox/label leaf name(s) whose
# messages should land in this webspace.
[webspaces.house-move.match.proton]
folders = ["House"]

# [webspaces.example-multi-source] — a second, purely illustrative
# webspace gathering one worked match-block example for every one of
# this repository's four real (non-mock) plugin types in a single place,
# alongside the "sources" participation allowlist. Uncomment to try it
# against your own real tag/folder/conversation names — every value
# below is a placeholder, not this deployment's actual data.
#
# [webspaces.example-multi-source]
# sources restricts participation to exactly these four instances — any
# OTHER configured instance (e.g. a second Proton account from the
# "home-email"/"work-email" example above, if you've uncommented it) is
# skipped entirely for this one webspace, even though it still
# participates normally in [webspaces.house-move] above (the allowlist is
# per-webspace, not global).
# sources = ["paperless", "silverbullet", "proton", "signal"]
#
# Every instance named in sources above has its own explicit block below
# — with full coverage like this, a keywords fallback line would simply
# go unused (legal, just redundant), so this example omits keywords
# entirely to demonstrate that match blocks alone are sufficient.
#
# [webspaces.example-multi-source.match.paperless]
# tags = ["Household", "Admin"]
#
# [webspaces.example-multi-source.match.silverbullet]
# tags = ["household"]
# pages = ["Household Tasks"]
#
# [webspaces.example-multi-source.match.proton]
# folders = ["Household"]
#
# [webspaces.example-multi-source.match.signal]
# conversations = ["Family Group", "Jane Doe"]

# [webspaces.demo] — pairs with the commented-out [sources.mock] block
# above: "demo" matches the label every one of plugins/mock's four fixed
# items carries, so uncommenting both blocks and running `webspaces sync`
# populates this webspace with all four mock items via the keywords
# fallback (mock declares a one-field vocabulary, "labels", so a bare
# keywords list is all it needs — no match block required).
# [webspaces.demo]
# keywords = ["demo"]
