codecrew: "1.0" # protocol version (SPEC.md §5): a different major is refused; not the CLI release — see gh codecrew version
hub: self

# Role routing: who holds each role (SPEC §5). Declare all five at
# onboarding. ~ routes the role to you, the human operator; replace it with
# a GitHub App slug or a username to delegate, or an org/team-slug to
# route the role to any member of a GitHub team. The coordinator is the
# seat that dispatches the other four (SPEC §7); unrouted, it is you.
roles:
  implementer: { identity: ~, harness: claude-code, model: claude-fable-5 }
  # reviewer: the operator's auth, but the review itself is a headless Codex
  # session loaded with `gh codecrew roles show reviewer` — de-correlated
  # judgment without an App (solo mode; merges use --operator-confirm).
  # `model` is the model the seat is dispatched under: the dispatch passes
  # it (`codex exec -m gpt-5.5 …`) and never inherits the harness default
  # (gh-codecrew #212); a seat that must reach GitHub from the sandbox also
  # takes `-c sandbox_workspace_write.network_access=true` (#202).
  reviewer: { identity: ~, harness: codex, model: gpt-5.5 }
  # qa: ~ is the solo-mode design, not an omission — verdicts come from
  # dispatched clean-context sessions loaded with `gh codecrew roles show
  # qa`, posting under the operator's own auth, which is exactly the
  # identity an unrouted seat resolves to (SPEC §5). `milestone close`
  # counts those verdicts as the operator holding the role; its
  # "qa is unrouted" note is informational in this tier (#73, M3-R5).
  qa: { identity: ~ }
  doc-synthesizer: { identity: ~ }
  coordinator: { identity: ~ }
