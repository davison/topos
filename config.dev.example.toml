# topos dev config template — checkout-agnostic; `make dev-config`
# expands this into an untracked, per-checkout config.dev.toml (see
# Makefile's DEV_CONFIG/dev-config), substituting the @CHECKOUT@
# placeholder below with the checkout root (CURDIR at generation time).
#
# The generated config.dev.toml is freely, permanently editable —
# `make dev-config` never overwrites a file that already exists, so any
# hand edit you make survives every `make dev`. It deliberately starts
# with no [sources.*] or [webspaces.*] tables; add your own dev-only
# instances directly to the generated file, or point at a shared dev
# config with `make dev DEV_CONFIG=<path>`.
#
# As with config.example.toml, a credential belongs ONLY as a ${VAR}
# reference expanded from the environment (Go's os.Expand) — never as a
# literal value in this file or the generated copy. config.dev.toml is
# gitignored, but the rule still applies: a literal secret here is a
# secret sitting in a per-checkout file outside git's own history
# protection, not a secret kept out of history entirely.

[server]
# 7778 is the DEV port — the installed instance owns the production
# port (kernel/config's DefaultListen), and the two must differ so both
# kernels can run side by side (ISOL-02). This value, the Makefile's
# DEV_PORT default, and web/vite.config.ts's proxy target move
# together; `make dev` refuses (naming both values) when this listen
# port and its own DEV_PORT disagree.
listen = "127.0.0.1:7778"

[index]
# @CHECKOUT@ becomes this checkout's own absolute root — each git
# worktree of this repo generates its own config.dev.toml (a different
# CURDIR), so each gets its own dev index, never the operator's
# production ~/.local/share/topos/index.db.
path = "@CHECKOUT@/bin/topos-dev-index.db"

[plugins]
# Both directories resolve inside THIS checkout's own bin/, so `make dev`
# in a worktree launches only what it just placed there: the mock its
# `plugins` prerequisite built, plus the sibling fleet it adopts from
# DEV_PLUGINS_DIR (a topos-plugins checkout's bin/, copied in on every
# run) — never the operator's production plugins.dir.
#
# external_dir must STAY present even when you use no external plugins:
# omitting the key makes the kernel fall back to its platform data
# default inside the installed instance's own state root, and the
# topos-devguard pre-flight `make dev` runs refuses exactly that.
dir = "@CHECKOUT@/bin/plugins"
external_dir = "@CHECKOUT@/bin/plugins-external-dev"

# --- per-checkout plugin stores -------------------------------------
#
# A source's own store path (its `path` key) is the one writable
# location this template cannot pre-fill for you — stores are declared
# per source. The rule: every source's store path in a dev config MUST
# sit under this checkout, in a per-checkout directory like the
# @CHECKOUT@/bin/plugin-state/... shape below — the placeholder is what
# gives each checkout (and each git worktree) its own store. Copying a
# [sources.*] block from your production config WITHOUT changing its
# path is the specific mistake the topos-devguard pre-flight refuses:
# it would point this dev run's store at the very files the installed
# instance is using.
#
# Example — a dev instance of a plugin that keeps its own local store
# (a linked-device session, a message cache). This is a SEPARATE store
# from your installed instance's: nothing done here disturbs the
# installed instance's, and a plugin that pairs or links does so once
# per store (its README in topos-plugins says how).
#
# [sources.<plugin>-dev]
# plugin = "topos-plugin-<plugin>"
# path = "@CHECKOUT@/bin/plugin-state/<plugin>"
