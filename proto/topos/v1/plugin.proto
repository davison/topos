syntax = "proto3";

package topos.v1;

option go_package = "github.com/davison/topos/sdk/gen/topos/v1;toposv1";

// SourcePlugin is read-only by construction. No RPC in this service changes
// state in the source system, and none may ever be added — see PLUG-02.
service SourcePlugin {
  rpc Describe(DescribeRequest) returns (DescribeResponse);
  rpc Match(MatchRequest) returns (MatchResponse);
  rpc Fetch(FetchRequest) returns (FetchResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
  // Search is OPTIONAL (M2-R2, davison/topos#50): a plugin that searches
  // its own content declares searches_content in Describe and implements
  // this; one that does not answers UNIMPLEMENTED, which the kernel
  // treats as "no body search from this source" — a declared absence,
  // never a contract incompatibility. Additive: no new contract
  // generation. See docs/plugin-contract.md "Search".
  rpc Search(SearchRequest) returns (SearchResponse);
}

message DescribeRequest {}
message DescribeResponse {
  string source_type      = 1;  // "paperless"
  string display_name     = 2;  // "paperless-ngx"
  // contract_version names the contract GENERATION ("topos.v2" as of Phase
  // 5's typed match-field break), versioned independently of the proto
  // package path (which stays "topos.v1" — no wire-incompatible message
  // numbering reset, only additive/replaced fields within the same
  // package). Do not confuse this string with the go_package/package
  // "topos.v1" above: a plugin built against the pre-Phase-5 contract also
  // reports "topos.v1" here, so contract_version — not the proto package —
  // is what a reader should compare to know which MatchRequest shape a
  // plugin expects. sdk.Handshake.ProtocolVersion (bumped 1->2 alongside
  // this) is the actual fail-fast: a stale binary never reaches the point
  // of returning this field at all.
  string contract_version = 3;  // "topos.v2"
  // match_vocabulary is the field-name vocabulary this plugin's Match RPC
  // reads from MatchRequest.match_fields, declared by the plugin itself —
  // the kernel holds no built-in table of known plugin types (D-05). The
  // four first-party examples — their plugins live in the topos-plugins
  // repository — are "folders" (proton), "tags" (paperless,
  // silverbullet), "conversations" (signal), "pages" (silverbullet) —
  // illustrations only, explicitly not a closed set. A future plugin type
  // (e.g. Phase 8's WhatsApp) declares its own vocabulary here with no
  // proto change required.
  repeated string match_vocabulary = 4;
  // icon and icon_mime are Phase 9's additive icon-identity fields
  // (09-UI-SPEC.md Fix 10). This is a proto3 additive change: a plugin
  // binary built against the pre-Phase-9 contract simply never sets these
  // two fields, so impl.Describe(...) on the kernel side returns
  // icon: nil, icon_mime: "" for it — no handshake break, and
  // sdk.Handshake.ProtocolVersion is deliberately NOT bumped here
  // (contrast Phase 5's typed-match-field break above, which changed an
  // EXISTING field's meaning and therefore did require a bump).
  //
  // icon is a small square SVG or PNG of at most 65536 (64KB) bytes.
  // Empty means the plugin declares no icon — never treated as an error,
  // just "no icon for this plugin type yet" (e.g. a pre-Phase-9 binary, or
  // a plugin type with no configured/launched instance).
  bytes icon = 5;
  // searches_content declares the OPTIONAL Search RPC (M2-R2): true only
  // when the plugin searches its own content within membership.
  bool searches_content = 8;
  // icon_mime is either "image/svg+xml" or "image/png". It is the empty
  // string if and only if icon is empty — a non-empty icon with an empty
  // mime, or a mime outside that two-value allowlist, is dropped kernel-
  // side and treated identically to "no icon declared"
  // (kernel/pluginhost/host.go's allowedIconMIME).
  string icon_mime = 6;
  // extras is Phase 11's additive declaration (D-15, PLUG-09): a plugin MAY
  // declare the provider-specific config.Source.Extras keys it expects, so
  // the kernel's add-source form can render labeled inputs instead of a
  // bare free-form key/value editor. Field 7 — the next free number; fields
  // 1-6 above are never renumbered or repurposed. A plugin that declares
  // nothing here is fully supported (the kernel falls back to the
  // free-form extras editor), and an older kernel simply ignores this
  // field entirely — this is additive exactly like icon/icon_mime were, so
  // sdk.Handshake.ProtocolVersion is NOT bumped for it.
  repeated ExtrasField extras = 7;
}

// ExtrasField is one provider-specific config.Source.Extras key a plugin
// declares expecting, via DescribeResponse.extras above (D-15).
message ExtrasField {
  // key is the exact Extras map key this field describes (e.g. "region") —
  // matched verbatim against the operator-authored [sources.<id>.extras]
  // key, never a display label.
  string key = 1;
  // label is the human-readable form input label the kernel's add-source
  // UI renders next to this field.
  string label = 2;
  // required signals the kernel's add-source form should not let the
  // operator submit without a value for this key — advisory only: the
  // kernel never rejects a saved config missing a "required" extras key,
  // since a plugin's own declared requirements are not something
  // kernel/config.Validate enforces (D-12: the kernel holds no built-in
  // knowledge of what an extras key means).
  bool required = 3;
  // secret signals the kernel's add-source form should render this
  // field's input masked (e.g. a password/API-key input), matching the
  // treatment base_url/token already receive.
  bool secret = 4;
  // placeholder is a DISPLAY-ONLY hint text the kernel's add-source form
  // may show inside the empty input — it must NEVER be pre-filled into a
  // value the kernel then saves, precisely so a malicious Describe
  // response cannot get its own suggested default (e.g. "${SOME_SECRET}")
  // silently persisted into the operator's config.toml and later expanded
  // (D-14, T-11-11).
  string placeholder = 5;
}

// StringList wraps a repeated string as a map value — proto3 maps cannot
// have a repeated field as their value type directly.
message StringList { repeated string values = 1; }

message MatchRequest {
  reserved 1;
  reserved "keywords"; // retired by Phase 5's typed match-field break — a
                        // future edit must never resurrect this field name
                        // under a new number (see sdk/contract_test.go's
                        // TestContractDeclaresMatchVocabulary).
  // match_fields maps a field name (one entry in the plugin's own declared
  // match_vocabulary) to the list of values that field must match against.
  // Every value comparison is exact and case-insensitive (D-04) — no
  // substring, prefix, glob, or hierarchy expansion. A key the plugin did
  // not declare in its own match_vocabulary is treated as absent, never as
  // an error (validation of unknown keys against config already happened
  // kernel-side at config load, D-05). An empty values list for a declared
  // key matches nothing for that field, never everything.
  map<string, StringList> match_fields = 2;
}
message MatchResponse { repeated Item items = 1; }

// SearchRequest (M2-R2, davison/topos#50): search this source's own content.
message SearchRequest {
  string query = 1;   // the operator's live query, whitespace-separated terms; all must match
  int32  limit = 2;   // at most this many hits; 0 means the plugin's own default
  // The webspace's resolved match_fields for THIS instance — the same map
  // MatchRequest carries, same semantics. The plugin ANDs the search with
  // membership: a hit is returned only if Match would also return it for
  // these fields. An empty or absent map is REFUSED (InvalidArgument) —
  // never "the whole source".
  map<string, StringList> match_fields = 3;
  // The webspace's saved filter terms that apply to this instance; a hit
  // must also match every one (title, preview or body), so a body hit can
  // never bypass a saved filter.
  repeated string required_terms = 4;
}
message SearchResponse {
  repeated SearchHit hits = 1;
  bool   truncated = 2; // more hits existed than limit allowed
  string note      = 3; // free text for the operator, e.g. "searched subjects and bodies of the last 90 days"
}
message SearchHit {
  Item      item       = 1; // the same shape sync produces — the kernel renders and merges from it
  string    snippet    = 2; // bounded, like Item.preview; never the body
  MatchedIn matched_in = 3;
}
enum MatchedIn {
  MATCHED_IN_UNSPECIFIED = 0;
  MATCHED_IN_TITLE       = 1;
  MATCHED_IN_BODY        = 2;
  MATCHED_IN_LABELS      = 3;
  MATCHED_IN_ATTACHMENT  = 4;
}

enum LinkFidelity {
  LINK_FIDELITY_UNSPECIFIED       = 0;
  LINK_FIDELITY_EXACT             = 1;
  LINK_FIDELITY_ANCHORED          = 2;
  LINK_FIDELITY_CONVERSATION_ONLY = 3;
}

message Item {
  string source_id                = 1;  // stable, plugin-local id
  string source_type              = 2;
  string title                    = 3;
  string preview                  = 4;  // bounded snippet, never full content
  int64  timestamp_unix           = 5;  // primary sort: real-world time
  int64  secondary_timestamp_unix = 6;  // tie-break: ingestion/receipt time
  LinkFidelity fidelity           = 7;
  string deep_link                = 8;
  repeated string labels          = 9;  // native categorization (paperless tag names)
  map<string, string> provenance  = 10;
  string group_id                 = 11; // chat thread / mail conversation; "" for documents
  string group_label              = 12;
  bool   has_thumbnail            = 13;
}

enum ContentVariant {
  CONTENT_VARIANT_UNSPECIFIED = 0;
  CONTENT_VARIANT_FULL        = 1;
  CONTENT_VARIANT_PREVIEW     = 2;
  CONTENT_VARIANT_THUMBNAIL   = 3;
}

message FetchRequest { string source_id = 1; ContentVariant variant = 2; }

// FetchResponse is a single unary response carrying full content (text and
// rendition bytes together). Decision D-Task1: option-a — unary Fetch. A
// rendition must fit in one gRPC message; the kernel plugin-host client and
// the plugin gRPC server both raise their default 4 MB message-size limits
// to accommodate large scanned PDFs.
message FetchResponse {
  bool   available                = 1;
  string unavailable_reason       = 2;
  string mime_type                = 3;  // "" when there is no binary rendition
  int64  size_bytes               = 4;
  string text                     = 5;  // extracted text, may be ""
  bytes  data                     = 6;  // rendition bytes, may be empty. For a
                                         // text/html mime_type, data is an
                                         // UNWRAPPED, UNTHEMED, UNSANITIZED
                                         // fragment (D-11) — the kernel, not
                                         // the plugin, sanitizes/wraps/themes
                                         // it via content_shape below.
  map<string, string> provenance  = 7;
  // content_shape is REQUIRED whenever mime_type is "text/html" — the kernel
  // refuses to serve a text/html rendition whose content_shape is
  // CONTENT_SHAPE_UNSPECIFIED (D-11, T-05-16). Ignored for every other
  // mime_type.
  ContentShape content_shape      = 8;
}

message HealthRequest {}
message HealthResponse { bool reachable = 1; int64 last_sync_unix = 2; string last_error = 3; }

// ContentShape (D-11) declares which of the kernel's rendition sanitize/wrap
// profiles applies to a FetchResponse whose mime_type is "text/html". The
// kernel refuses to serve a text/html rendition whose content_shape is
// CONTENT_SHAPE_UNSPECIFIED — the zero value fails closed, exactly like
// LinkFidelity and ContentVariant above.
enum ContentShape {
  CONTENT_SHAPE_UNSPECIFIED       = 0;
  CONTENT_SHAPE_EMAIL_HTML        = 1;
  CONTENT_SHAPE_CHAT_TRANSCRIPT   = 2;
  CONTENT_SHAPE_MARKDOWN_HTML     = 3;
}
