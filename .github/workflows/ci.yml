# The repository's first CI workflow (D-13). Runs the full portable gate —
# Go tests across every workspace module, svelte-check, vitest,
# the e2e spec tree's own typecheck, and the hermetic Playwright suite —
# on every push and pull request to main. No repository secret and no
# live-source credential variable is referenced anywhere in this file
# (D-07/D-10 make that structurally true, not just a policy): the harness
# never launches a real source plugin, only the mock-shaped fixtures under
# plugins/mock and plugins/mockstrict.
#
# Every step below invokes an official actions/* action only, pinned to
# its current major version (re-verified against each action's own GitHub
# releases at the time this workflow was written — see
# 07.1-RESEARCH.md Assumptions Log entry A4, which flagged the research
# skeleton's own version numbers as a low-confidence snapshot that needed
# re-checking before use).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # Job-level backstop (2026-08-18, quick task 260818-ov4): two
    # consecutive runs hung >15 minutes inside an apt fetch with nothing
    # to reap them. No single step below legitimately approaches this
    # bound, so hitting it always means "hung", never "slow".
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Playwright browser downloads are cached separately from npm's own
      # cache (above) — keyed on the lockfile so a dependency bump busts
      # the cache. `make e2e` (below) performs the browser install itself
      # and is idempotent, so no separate install step is needed here: a
      # cache hit simply makes that install step a no-op download-wise.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      # The cheapest gate in this job — plain relative-path resolution,
      # no build, no network access — so it runs first and fails fast.
      - run: make docs-check

      - run: npm --prefix web ci

      - run: npm --prefix web run check
      - run: npm --prefix web run test
      - run: npm --prefix web run check:e2e

      # The Go half. test-portable is the stable CI entry point; since
      # the functional plugins (including the cgo signal build) moved to
      # davison/topos-plugins, `make test` is its alias.
      - run: make test-portable

      # E2E_PW_INSTALL_FLAGS is set to Playwright's system-dependency
      # install flag for THIS step only — the runner needs its OS package
      # dependencies installed, but a developer's own machine must never
      # have `make e2e` invoke a privileged installer by default (see the
      # Makefile's own E2E_PW_INSTALL_FLAGS comment). E2E_PROJECT is left
      # at its "chromium" default: D-14 makes Chromium the only engine the
      # automated gate runs; Firefox/WebKit stay manual-only.
      # 2026-08-18 (quick task 260818-ov4): two consecutive runs hung
      # >15 minutes inside Playwright's `--with-deps` apt phase — the
      # runner's default azure.archive.ubuntu.com mirror failed (Ign:
      # spam in the log) and the fallback fetch then stalled, with no
      # timeout anywhere to catch it. This step repoints apt at the
      # canonical archive.ubuntu.com and bounds every apt fetch with
      # retries and per-connection timeouts, so a sick mirror surfaces
      # as a fast, named failure in THIS step rather than a silent hang
      # inside `make e2e`. The `apt-get update` here also pre-warms the
      # indices Playwright's own apt run needs.
      - name: Harden apt against mirror stalls
        timeout-minutes: 5
        run: |
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$f" ]; then
              sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' "$f"
            fi
          done
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
            | sudo tee /etc/apt/apt.conf.d/99ci-mirror-timeouts >/dev/null
          sudo apt-get update

      - name: make e2e
        # Bounded (260818-ov4): the suite itself runs ~1-2 minutes; the
        # first-time browser + OS-deps install adds a few more on a cold
        # cache. 10 minutes is comfortably above both and far below the
        # silent 17-minute hangs this bound exists to convert into
        # failures.
        timeout-minutes: 10
        run: make e2e
        env:
          E2E_PW_INSTALL_FLAGS: --with-deps

      # A failing run carries its own evidence: every Playwright trace and
      # screenshot from a failed spec lives under web/e2e/.artifacts (D-15).
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/e2e/.artifacts/
          retention-days: 7
