# Publishes a tagged GitHub Release carrying the kernel binary and the
# operator-facing portable plugin binaries plus a sha256 checksums file.
# Triggered by pushing a tag matching v*.*.* — this is the repo's
# publishing path (success criterion 6); ci.yml never publishes anything.
#
# Every step below invokes an official actions/* action only, pinned to
# its current major version (matching ci.yml's own convention), plus the
# runner-preinstalled `gh` CLI for release creation and asset upload. No
# repository secret is referenced anywhere in this file — the only
# credential is the automatic GITHUB_TOKEN, scoped to contents: write at
# the job level and nothing else.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: make build-portable

      # Hashes and publishes in one step so the shipped asset list is
      # written exactly once and cannot drift between the two.
      # topos-plugin-mock is built by the plugins target but deliberately
      # absent here: it is the PLUG-05 contract-reference fixture, not an
      # operator-facing source (kernel/pluginhost.ExcludedPluginBinaries
      # already keeps it out of the operator's "+" picker catalog), so
      # shipping it as a release asset would contradict that policy.
      - name: Hash and publish release assets
        run: |
          ASSETS="topos"
          (cd bin && sha256sum $ASSETS > checksums.txt)
          PUBLISH=""
          for a in $ASSETS; do PUBLISH="$PUBLISH bin/$a"; done
          gh release create "$GITHUB_REF_NAME" $PUBLISH bin/checksums.txt \
            --title "$GITHUB_REF_NAME" \
            --notes "Plugin binaries are no longer published here — the source plugins live in https://github.com/davison/topos-plugins, whose own signed releases carry them (see docs/install.md for the interim download-and-place path)." \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
